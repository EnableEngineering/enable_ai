[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "nlp-api-caller"
version = "0.1.0"
description = "AI-powered natural language interface for REST APIs, databases, and knowledge graphs with MCP server support"
authors = ["Rhishikesh Thakur <youremail@example.com>"]
license = "MIT"
readme = "README.md"
homepage = "https://github.com/yourusername/nlp-api-caller"
repository = "https://github.com/yourusername/nlp-api-caller"
keywords = ["nlp", "api", "natural-language", "ai", "mcp", "llm", "rest-api", "database"]

[tool.poetry.dependencies]
python = "^3.8"
requests = "^2.28.0"
openai = "^1.0.0"
mcp = "^0.9.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.0.0"
pytest-asyncio = "^0.21.0"
black = "^23.0.0"
flake8 = "^6.0.0"
mypy = "^1.0.0"

[tool.poetry.group.database]
optional = true

[tool.poetry.group.database.dependencies]
psycopg2-binary = "^2.9.0"
mysql-connector-python = "^8.0.0"
pymongo = "^4.0.0"

[tool.poetry.group.rag]
optional = true

[tool.poetry.group.rag.dependencies]
sentence-transformers = "^2.2.0"
torch = "^2.0.0"
PyPDF2 = "^3.0.0"

[tool.poetry.scripts]
nlp-api-caller = "nlp_api_caller.mcp_server:main"

[build]
source = "src"