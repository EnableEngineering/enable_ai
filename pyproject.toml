[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "enable-ai"
version = "1.0.20"
description = "AI-powered natural language to REST API translation. v2: Claude native tool calling, zero hardcoding, works with any OpenAPI spec."
authors = ["Enable Engineering"]
license = "MIT"
readme = "README.md"
homepage = "https://github.com/EnableEngineering/enable_ai"
repository = "https://github.com/EnableEngineering/enable_ai"
keywords = ["nlp", "api", "natural-language", "ai", "llm", "rest-api", "openai", "tool-calling"]
packages = [
    { include = "enable_ai_v2", from = "src" },
]

[tool.poetry.dependencies]
python = ">=3.9.0,<4.0"
openai = "^1.0.0"
httpx = "^0.27.0"
pyyaml = "^6.0"
python-dotenv = "^0.19.0"
anthropic = { version = "^0.34.0", optional = true }

[tool.poetry.extras]
anthropic = ["anthropic"]

[tool.poetry.group.dev.dependencies]
pytest = "^7.0.0"
pytest-asyncio = "^0.21.0"
black = "^23.0.0"
flake8 = "^6.0.0"
mypy = "^1.0.0"

# Database and RAG dependencies removed - API-only focus
# Future: May add back as optional extras


[tool.pyright]
# Resolve 'enable_ai' from src/ when project root is the workspace (IDE/tests)
extraPaths = ["src"]